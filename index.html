let ac=null, master=null, noiseBuf=null, slither=null;
function audioInit(){
  if(ac){ if(ac.state==='suspended') ac.resume(); return; }
  try{ ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
  master=ac.createGain(); master.gain.value=0.7; const comp=ac.createDynamicsCompressor(); master.connect(comp); comp.connect(ac.destination);
  noiseBuf=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  // wind + drone bed
  const n=noise(), lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=380; const ng=ac.createGain(); ng.gain.value=0.07; n.connect(lp); lp.connect(ng); ng.connect(master); n.start();
  const lfo=ac.createOscillator(); lfo.frequency.value=0.09; const lg=ac.createGain(); lg.gain.value=220; lfo.connect(lg); lg.connect(lp.frequency); lfo.start();
  [43.6,46.2].forEach(f=>{ const o=ac.createOscillator(); o.frequency.value=f; const g=ac.createGain(); g.gain.value=0.05; o.connect(g); g.connect(master); o.start(); });
  // slithering vines (silent until the spread)
  const s=noise(), bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=900; bp.Q.value=1.5; slither=ac.createGain(); slither.gain.value=0; s.connect(bp); bp.connect(slither); slither.connect(master); s.start();
}
function noise(){ const s=ac.createBufferSource(); s.buffer=noiseBuf; s.loop=true; return s; }
function env(g,t0,a,p,d){ g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(p,t0+a); g.gain.exponentialRampToValueAtTime(0.0001,t0+a+d); }
const sfx={
  boom(v){ if(!ac) return; const t=ac.currentTime, o=ac.createOscillator(); o.frequency.setValueAtTime(70,t); o.frequency.exponentialRampToValueAtTime(28,t+1.2); const g=ac.createGain(); o.connect(g); g.connect(master); env(g,t,.01,v||.7,1.4); o.start(t); o.stop(t+1.6); },
  squelch(){ if(!ac) return; const t=ac.currentTime, n=noise(), bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=4; bp.frequency.setValueAtTime(300,t); bp.frequency.exponentialRampToValueAtTime(1200,t+.35); const g=ac.createGain(); n.connect(bp); bp.connect(g); g.connect(master); env(g,t,.02,.35,.4); n.start(t); n.stop(t+.5); },
  step(v){ if(!ac) return; const t=ac.currentTime, n=noise(), lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=260; const g=ac.createGain(); n.connect(lp); lp.connect(g); g.connect(master); env(g,t,.004,v||.25,.12); n.start(t); n.stop(t+.2); },
  crunch(){ if(!ac) return; for(let i=0;i<3;i++){ const t=ac.currentTime+i*.12, n=noise(), hp=ac.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=1500; const g=ac.createGain(); n.connect(hp); hp.connect(g); g.connect(master); env(g,t,.003,.35,.09); n.start(t); n.stop(t+.12); } },
  growl(){ if(!ac) return; const t=ac.currentTime, o=ac.createOscillator(); o.type='sawtooth'; o.frequency.setValueAtTime(85,t); o.frequency.linearRampToValueAtTime(60,t+2.5);
    const v=ac.createOscillator(); v.frequency.value=24; const vg=ac.createGain(); vg.gain.value=20; v.connect(vg); vg.connect(o.frequency); const f=ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=600; const g=ac.createGain(); o.connect(f); f.connect(g); g.connect(master); env(g,t,.3,.4,2.5); o.start(t); v.start(t); o.stop(t+3); v.stop(t+3); },

    [440,466,700].forEach(f=>{ const o=ac.createOscillator(); o.type='sawtooth'; o.frequency.setValueAtTime(f,t); o.frequency.linearRampToValueAtTime(f*1.6,t+.3); const g2=ac.createGain(); o.connect(g2); g2.connect(master); env(g2,t,.01,.18,1.1); o.start(t); o.stop(t+1.3); }); sfx.boom(.9); },
  beat(){ if(!ac) return; [0,.17].forEach((dt,i)=>{ const t=ac.currentTime+dt, o=ac.createOscillator(); o.frequency.setValueAtTime(60,t); o.frequency.exponentialRampToValueAtTime(38,t+.12); const g=ac.createGain(); o.connect(g); g.connect(master); env(g,t,.005,i?.35:.5,.16); o.start(t); o.stop(t+.25); }); },

/* ---------- the timeline ---------- */
const tmp=V(0,0,0);
let lastT=-1;
function updateScene(T,t){
  if(T<lastT-0.5) lastT=-1;                         // restarted
  EVENTS.forEach(([at,fn])=>{ if(lastT<at && T>=at) fn(); }); lastT=T;
  // title
  titleP.material.opacity=sm(S[0]-1.5,S[0]+0.5,T)*(1-sm(S[1]-0.5,S[1]+1.5,T));
  // plant growth
  const g=sm(S[2]+0.3,S[2]+6.5,T);
  setGrow(stem,g*1.1); branches.forEach(b=>setGrow(b.m,(g-0.35-b.t0)/0.45));
  leaves.forEach(o=>{ const k=sm(o.t0+0.3,o.t0+0.6,g); o.l.scale.setScalar(Math.max(0.001,k*o.s)); });
  const sway=Math.sin(t*0.8)*0.02;
  // fruit
  const fk=sm(S[3]+0.2,S[3]+3.2,T), pulse=0.75+0.25*Math.sin(t*3.2);
  fruits.forEach((o,i)=>{ const k=sm(o.t0,o.t0+0.6,fk*1.6); o.f.scale.setScalar(Math.max(0.001,k*1.6)); o.f.rotation.z=sway; o.glow.material.opacity=k*0.55*pulse; });
  fruitM.emissive.setRGB(0.35*pulse*fk+0.1,0,0);
  fruitLight.intensity=fk*1.6*pulse;
  // the farmer walks in, reaches, eats
  const s4=S[4], s5=S[5];
  man.visible = T>s4-0.5 && T<s5+9.8;
  if(man.visible){
    const wk=sm(s4,s4+4.5,T), p=walkCurve.getPointAt(Math.min(1,wk)); man.position.copy(p);
    let facing=Math.atan2(walkCurve.getTangentAt(Math.min(.999,wk)).x,walkCurve.getTangentAt(Math.min(.999,wk)).z);
    const walking=T<s4+4.5, ph=T*7;
    legL.rotation.x=walking?Math.sin(ph)*0.45:0; legR.rotation.x=walking?-Math.sin(ph)*0.45:0;
    armL.rotation.set(walking?-Math.sin(ph)*0.35:0,0,0.05); armR.rotation.set(walking?Math.sin(ph)*0.35:0,0,-0.05);
    upper.rotation.set(0,0,0); headG.rotation.set(0,0,0);
    if(!walking){ facing=Math.atan2(PLANT.x-man.position.x,PLANT.z-man.position.z); }
    // reach for a fruit and eat it
    const reach=sm(s4+4.6,s4+5.6,T), toMouth=sm(s4+5.7,s4+6.5,T);
    if(T>s4+4.5 && T<s5){ armR.rotation.x=-reach*1.5+toMouth*-0.6; armR.rotation.z=-0.05-toMouth*0.6; headG.rotation.x=toMouth*-0.2+(T>s4+6.6?Math.sin(t*14)*0.06:0); }
    const victim=fruits[2];
    if(T>s4+5.5 && T<s4+7){ victim.f.visible=false; bitten.visible=true; armR.updateMatrixWorld(true); bitten.position.copy(armR.localToWorld(tmp.set(0,-0.68,0.04))); }
    else bitten.visible=false;
    if(T<s4+5.5) victim.f.visible=true;
    // transformation
    const tr=sm(s5,s5+5,T);
    if(T>s5){
      const sh=reduceMotion?0:Math.sin(t*40)*0.05*tr*(T<s5+7?1:0.3);
      upper.rotation.x=0.55*tr+sh; headG.rotation.z=Math.sin(t*9)*0.25*tr; headG.rotation.x=-0.4*tr;
      armL.rotation.set(-1.2*tr,0,0.4*tr+sh); armR.rotation.set(-1.2*tr,0,-0.4*tr-sh);
      skinM.color.setRGB(0.75-0.4*tr,0.54-0.25*tr,0.42-0.2*tr);
      eyes.forEach(e=>e.material.opacity=tr);
      hat.visible=tr<0.6;
      // turns to face you, then rushes
      if(T>s5+6){ facing=Math.atan2(-man.position.x,-man.position.z); }
      const rush=sm(s5+8.0,s5+9.6,T);
      if(rush>0){ man.position.lerpVectors(manPath[3],V(0,0,-0.45),rush); const rp=T*14; legL.rotation.x=Math.sin(rp)*0.8; legR.rotation.x=-Math.sin(rp)*0.8; }
    } else { skinM.color.setRGB(0.75,0.54,0.42); eyes.forEach(e=>e.material.opacity=0); hat.visible=true; }
    man.rotation.y=facing;
  }
  // red flash at the lunge
  const fl=T>S[5]+9.6 ? Math.max(0,1-(T-(S[5]+9.6))/1.4) : 0; flash.material.opacity=fl*0.85;
  // spread of the plant
  const sp=sm(S[7]-0.5,S[7]+9,T);
  vines.forEach(v=>setGrow(v.m,(sp-v.t0)/0.65*v.sp));
  berries.forEach(o=>{ o.b.visible=(sp-o.v.t0)/0.65*o.v.sp>o.u; o.b.scale.setScalar(0.8+0.3*Math.sin(t*4+o.u*20)); });
  veins.material.opacity=sp*0.9;
  if(slither) slither.gain.value=0.12*sm(S[7]-0.5,S[7]+1,T)*(1-sm(S[8]+4,S[8]+8,T));
  scene.fog.density=0.085+0.04*sp;
  // the root core and the mission
  core.visible=T>S[6]+2; const ck=sm(S[7]+2,S[8]+1,T), cp=0.6+0.4*Math.sin(t*4.5);
  core.scale.set(1+0.08*cp*ck,0.55+0.05*cp*ck,1+0.08*cp*ck); coreM.emissive.setRGB(0.25+0.6*cp*ck,0,0);
  coreRing.material.opacity=sm(S[8],S[8]+1.5,T)*(0.5+0.5*Math.sin(t*5)); coreRing.scale.setScalar(1+0.15*Math.sin(t*5));
  missionP.material.opacity=sm(S[8]-0.2,S[8]+1.2,T);
  // subtitles
  let cur=''; S.forEach((st,i)=>{ if(T>=st-0.1 && T<st+CUE.durs[i]+0.9) cur=LINES[i]; });
  if(renderer.xr.isPresenting) setVRSub(cur); else if($('sub').textContent!==cur) $('sub').textContent=cur;
  endP.material.opacity=renderer.xr.isPresenting ? sm(CUE.total-3,CUE.total-1.5,T) : 0;
  $('prog').style.width=(Math.min(1,T/CUE.total)*100).toFixed(2)+'%';
}

/* ---------- playback clock ---------- */
let playing=false, ended=false, clockT=0, useClock=false;
function nowT(){ return useClock ? clockT : narr.currentTime; }
narr.addEventListener('error',()=>{ useClock=true; });
narr.addEventListener('ended',()=>onEnd());
function onEnd(){ ended=true; playing=false; if(!renderer.xr.isPresenting){ $('hud').hidden=true; $('end').hidden=false; $('againBtn').focus(); } }
function play(fromStart){
  audioInit(); ended=false;
  if(fromStart){ narr.currentTime=0; clockT=0; lastT=-1; }
  playing=true; const p=narr.play(); if(p && p.catch) p.catch(()=>{ useClock=true; });
  $('pauseBtn').textContent='一時停止';
}
function pause(){ playing=false; narr.pause(); $('pauseBtn').textContent='再生'; }
$('playBtn').addEventListener('click',()=>{ $('start').hidden=true; $('end').hidden=true; $('hud').hidden=false; play(true); });
$('againBtn').addEventListener('click',()=>{ $('end').hidden=true; $('hud').hidden=false; play(true); });
$('restartBtn').addEventListener('click',()=>play(true));
$('pauseBtn').addEventListener('click',()=>{ playing?pause():play(false); });
addEventListener('keydown',e=>{ if(e.code==='Space' && !$('hud').hidden){ e.preventDefault(); playing?pause():play(false); } });

/* ---------- desktop look ---------- */
let yaw=0, pitch=-0.06, drag=false, lx=0, ly=0;
renderer.domElement.addEventListener('pointerdown',e=>{ drag=true; lx=e.clientX; ly=e.clientY; renderer.domElement.setPointerCapture(e.pointerId); });
renderer.domElement.addEventListener('pointermove',e=>{ if(!drag) return; yaw+=(e.clientX-lx)*0.004; pitch=Math.max(-1.1,Math.min(1.1,pitch+(e.clientY-ly)*0.004)); lx=e.clientX; ly=e.clientY; });
renderer.domElement.addEventListener('pointerup',()=>{ drag=false; });
camera.position.set(0,1.6,0);

/* ---------- VR ---------- */
const vrNote=$('vrNote');
function note(t){ vrNote.textContent=t; vrNote.hidden=false; }
if(!navigator.xr) $('vrBtn').hidden=true;
else navigator.xr.isSessionSupported('immersive-vr').then(ok=>{ if(!ok) $('vrBtn').hidden=true; }).catch(()=>{ $('vrBtn').hidden=true; });
let vrFrames=0, vrAlign=false;
const ctrls=[0,1].map(k=>{ const c=renderer.xr.getController(k); dolly.add(c); c.addEventListener('select',()=>{ if(ended || !playing){ play(true); } }); return c; });
$('vrBtn').addEventListener('click',async()=>{
  audioInit(); narr.currentTime=0; narr.play().catch(()=>{});   // start the narration inside the click itself: Quest blocks play() that comes after the await
  try{
    const session=await navigator.xr.requestSession('immersive-vr',{optionalFeatures:['local-floor','bounded-floor']});
    session.addEventListener('end',()=>{ subP.visible=false; pause(); $('start').hidden=false; $('hud').hidden=true; dolly.position.set(0,0,0); dolly.rotation.set(0,0,0); camera.position.set(0,1.6,0); resize(); });
    await renderer.xr.setSession(session);
    $('start').hidden=true; subP.visible=true; vrFrames=0; vrAlign=true; play(true);
  }catch(e){ note('VRを開始できませんでした（'+(e.name||e.message)+'）。ページの置き場所によってはVRが許可されません。'); }
});
const qH=new THREE.Quaternion();
function alignVR(){ // face the plant and stand at the viewing spot
  const h=V(0,0,0); camera.getWorldPosition(h); camera.getWorldQuaternion(qH); const f=V(0,0,-1).applyQuaternion(qH); const yawNow=Math.atan2(-f.x,-f.z);
  const a=-yawNow; dolly.position.sub(h).applyAxisAngle(UP,a).add(h); dolly.rotation.y+=a; camera.getWorldPosition(h); dolly.position.x-=h.x; dolly.position.z-=h.z; }

/* ---------- loop ---------- */
function resize(){ const w=stageEl.clientWidth||innerWidth, h=stageEl.clientHeight||innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); }
addEventListener('resize',resize); resize();
const clock=new THREE.Clock();
function loop(){
  const dt=Math.min(clock.getDelta(),0.05), t=clock.elapsedTime;
  if(useClock && playing){ clockT+=dt; if(clockT>=CUE.total){ clockT=CUE.total; onEnd(); } }
  if(renderer.xr.isPresenting){ vrFrames++; if(vrAlign && vrFrames>3){ alignVR(); vrAlign=false; } }
  else { if(!drag && !playing && $('start').hidden===false){ yaw=Math.sin(t*0.1)*0.3; } camera.rotation.set(pitch,yaw,0); }
  const T=$('start').hidden ? nowT() : 24 + Math.sin(t*0.05)*0;   // the title screen shows the plant in fruit behind it
  updateScene(T,t);
  renderer.render(scene,camera);
}
renderer.setAnimationLoop(loop);
})();
</script>
